name: Apply GeoClick 2.0 workspace changes

on:
  push:
    branches:
      - agent/location-verification-workspace-2.0.0
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/location-verification-workspace-2.0.0
          fetch-depth: 0

      - name: Reassemble and apply verified source archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/v200-payload2/chunk-00.b64 \
            .github/v200-payload2/chunk-01.b64 \
            .github/v200-payload2/chunk-02.b64 \
            .github/v200-payload/part-01.b64 \
            .github/v200-payload/part-02.b64 \
            .github/v200-payload/part-03.b64 \
            .github/v200-payload/part-04.b64 \
            .github/v200-payload/part-05.b64 \
            | tr -d '\n' \
            | base64 --decode > /tmp/v200-changes.tar.xz
          echo '6cbd298f49ea6322a94f9a1d1984da711b60db2252c6522aa3860e33d4763db3  /tmp/v200-changes.tar.xz' | sha256sum -c -
          tar -xJf /tmp/v200-changes.tar.xz -C .
          rm -rf .github/v200-payload .github/v200-payload2 .github/workflows/apply-v200.yml

      - name: Validate before commit
        run: |
          python -m compileall -q qgis_latlon
          python -m unittest discover -s tests -v

      - name: Commit complete workspace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Location Verification Workspace 2.0.0'
          git push origin HEAD:agent/location-verification-workspace-2.0.0
