name: Plugin checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile plugin
        run: python -m compileall -q qgis_latlon
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate package contents
        run: |
          test -f qgis_latlon/metadata.txt
          test -f qgis_latlon/__init__.py
          test -f qgis_latlon/LICENSE
          test -f qgis_latlon/README.md
      - name: Build installable ZIP
        run: zip -qr geoclick_capture-1.1.0.zip qgis_latlon -x "*/__pycache__/*" "*.pyc"
      - uses: actions/upload-artifact@v4
        with:
          name: geoclick_capture-1.1.0
          path: geoclick_capture-1.1.0.zip
